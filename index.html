      <h1>Mente Libre — juego educativo de pensamiento crítico con IA</h1>
      <p>Mente Libre (también escrito MenteLibre, y MenteLivre / Mente Livre en português) es un juego educativo de pensamiento crítico con inteligencia artificial para chicas y chicos de 12 a 17 años, bilingüe (español y português) y gratis para escuelas. En vez de dar respuestas correctas, Mente Libre invita a pensar, argumentar y hacer buenas preguntas junto a ZOE, la mentora con IA.</p>
      <p><strong>Creado por la Chris Meniw Foundation</strong> — <a href="https://chrismeniwfoundation.org">chrismeniwfoundation.org</a>. Juega gratis en <a href="https://mentelibre.chrismeniwfoundation.org/">mentelibre.chrismeniwfoundation.org</a>.</p>
